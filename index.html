<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ayain ka mag date</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6f2;
            color: #333;
            padding: 20px;
        }
        .letter {
            margin: 20px auto;
            max-width: 400px;
            min-height: 600px;
            padding: 20px;
            background-color: #fff;
            border: 2px solid #ff69b4;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.5s ease;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
            margin-left: -50px;
            z-index: 2;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            margin-left: 50px;
            z-index: 1;
        }
        #response {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        .gif-container {
            position: absolute;
            top: 70%; 
            left: 50%;
            transform: translateX(-50%);
            display: none; 
            text-align: center;
        }
        .gif-container img {
            width: 100px; 
            height: auto;
        }
    </style>
</head>
<body>
    <div class="letter">
        <h2>Helloooooo</h2>
        <p>Mag kuha sana me ng motor after ko mag finish contract so,<br>
        Pwede ba us gumala? Bwahhaaha</p>
        <p>Yes or No</p>
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
        <div class="gif-container" id="gifContainer">
            <img id="gifImage" src="https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjlwZG9pN3Z0c3FkOGVjYWVicWQzd2ltM2hkeHF4eDAwZTZobGR5MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/fFa05KbZowXiEIyRse/giphy.gif" alt="GIF"> 
            <br>
        </div>
        <div id="response"></div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const response = document.getElementById('response');
        const gifContainer = document.getElementById('gifContainer');
        const gifImage = document.getElementById('gifImage');
        let scale = 1; 
        let noClickCount = 0; 
        const noMessages = [
            "Sure kaba dyan? :(",
            "Sige na pleaseeee!!",
            "Ako nato si natoy",
            "Just click yes napo",
            "Aray, Iiyak ako dito",
            "Yes muna kasiii",
            "it will be fun po",
            "Hindi pwedeng hindi"
        ];

        yesBtn.addEventListener('click', () => {
            response.innerHTML = "Yay! Mag e-enjoy ka promise!!";
            response.style.display = 'block';
            noBtn.style.display = 'none'; 
            yesBtn.style.marginLeft = '0px'; 
            yesBtn.style.transform = `translate(-50%, -50%) scale(${scale + 1})`; 
            yesBtn.disabled = true;
            noBtn.style.display = false;
            noBtn.disabled = true;
            gifImage.src = "https://media3.giphy.com/media/v1.Y2lkPTZjMDliOTUybHloZXJ6bXM3Nmo2dGZmNmRqYXF4aGcwYTFocTdsOWVjNDB6dDhlbCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/T70hpBP1L0N7U0jtkq/giphy.gif"; 
            gifContainer.style.display = 'block'; 
        });

        noBtn.addEventListener('click', () => {
            scale += 0.3; 
            yesBtn.style.transform = `translate(-50%, -50%) scale(${scale})`; 
            const messageIndex = noClickCount % noMessages.length;
            response.innerHTML = noMessages[messageIndex];
            response.style.display = 'block';
            gifImage.src = "https://media1.giphy.com/media/v1.Y2lkPTZjMDliOTUyNjlwZG9pN3Z0c3FkOGVjYWVicWQzd2ltM2hkeHF4eDAwZTZobGR5MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/fFa05KbZowXiEIyRse/giphy.gif";
            gifContainer.style.display = 'block';
            noClickCount++;
        });
    </script>
</body>
</html>
